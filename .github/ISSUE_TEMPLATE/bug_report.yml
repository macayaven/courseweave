name: Bug report
description: Report a reproducible CourseWeave defect using synthetic or public data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the reporting route in SECURITY.md. Do not include credentials, learner records, private course material, or raw provider transcripts.
  - type: input
    id: version
    attributes:
      label: CourseWeave version or commit
      placeholder: v0.1.0 or a full commit ID
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, JupyterLab, Node/pnpm if relevant, and course version or commit.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Give the smallest steps and synthetic inputs that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the safe, redacted error and whether work or state changed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safe report
      options:
        - label: I removed credentials, learner data, private paths, and raw provider content.
          required: true
