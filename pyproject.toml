[project]
name = "courseweave"
dynamic = ["version"]
description = "Local-first course platform with a phase-aware JupyterLab learner guide"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "typer==0.27.2",
    "pydantic==2.13.5",
    "pydantic-ai-slim[ag-ui,openai,anthropic]==2.37.0",
    "jsonschema==4.26.0",
    "mistune==3.3.4",
]

[project.urls]
Homepage = "https://github.com/macayaven/courseweave"
Documentation = "https://github.com/macayaven/courseweave#readme"
Repository = "https://github.com/macayaven/courseweave"
Issues = "https://github.com/macayaven/courseweave/issues"

[project.scripts]
courseweave = "courseweave.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "hatchling==1.32.0",
    "jupyterlab==4.6.3",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/courseweave/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/courseweave"]

[tool.hatch.build.targets.wheel.shared-data]
"src/courseweave/labextension" = "share/jupyter/labextensions/@courseweave/lab"

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true
include = [
    "/src", "/tests", "/frontend", "/examples", "/uv.lock", "/README.md",
    "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/AGENTS.md", "/author-setup.md",
    "/LICENSE", "/THIRD_PARTY_LICENSES.md",
    "/.github", "/docs", "/scripts",
]
exclude = ["/frontend/**/node_modules", "/frontend/test-results", "/frontend/playwright-report", "/frontend/**/.vite", "/frontend/packages/lab/lib", "**/*.tsbuildinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
